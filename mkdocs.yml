site_name: BasinForge
site_description: Lumped hydrological simulation and calibration for teaching and research
site_url: https://barbhuiya12.github.io/basinforge-hydro/
repo_url: https://github.com/Barbhuiya12/basinforge-hydro
repo_name: Barbhuiya12/basinforge-hydro
use_directory_urls: false
theme:
  name: material
  font: false
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.top
    - toc.follow
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
extra:
  version: 0.2.0
