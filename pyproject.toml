[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "basinforge-hydro"
version = "0.2.0"
description = "Reproducible single- and multi-basin lumped hydrological calibration"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = ["lumod==0.1.3.0", "smartpy==0.2.2", "numba>=0.61", "pyyaml>=6", "numpy>=1.26", "pandas>=2.2", "scipy>=1.15", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
docs = ["Markdown>=3.7,<4"]

[project.urls]
Homepage = "https://barbhuiya12.github.io/basinforge-hydro/"
Repository = "https://github.com/Barbhuiya12/basinforge-hydro"
Issues = "https://github.com/Barbhuiya12/basinforge-hydro/issues"

[project.scripts]
basinforge = "basinforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
basinforge = ["*.m", "*.json", "_vendor/marrmot/*.m", "_vendor/*/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
