name: Optional MARRMoT integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y octave octave-optim
      - run: python -m pip install -e '.[dev,docs,reference]'
      - run: python -m pytest -q
        env:
          BASINFORGE_TEST_MARRMOT: '1'
